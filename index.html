<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie, responda e compartilhe quizzes com imagens.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styleMobile.css">
    <link rel="stylesheet" href="css/styleDesktop.css">
    <title>BuzzQuizz</title>
</head>
<body>
    <header>
        <h1>BuzzQuizz</h1>
    </header>

    <main class="paginaum">
        <section class="criarprimeiroquizz">
            <p>Você ainda não criou nenhum quiz.</p>
            <button type="button" class="criarquizz" onclick="chamarTelaCriarQuizz()">Criar quiz</button>
        </section>

        <section class="meus-quizzes">
            <div class="novo-quizz">
                <h2>Seus quizzes</h2>
                <button type="button" class="adicionar-quizz" aria-label="Criar outro quiz" onclick="chamarTelaCriarQuizz()">+</button>
            </div>
            <div class="quizzes-criados"></div>
        </section>

        <section class="todososquizzes">
            <h2>Explore os quizzes</h2>
            <p class="status-quizzes" role="status" aria-live="polite">Carregando quizzes…</p>
            <div class="quizzes"></div>
        </section>
    </main>

    <main class="pagina-quizz" aria-live="polite"></main>
    <div class="fim" aria-live="polite"></div>

    <div class="cria-quizz">
        <main class="vamos-comecar">
            <h1>Comece pelo começo</h1>
            <div class="primeiro-forms">
                <input class="titulo-quizz" type="text" placeholder="Título do seu quiz" aria-label="Título do quiz" minlength="20" maxlength="65">
                <input class="url-quizz" type="url" placeholder="URL da imagem do seu quiz" aria-label="URL da imagem do quiz">
                <input class="numero-perguntas" type="number" placeholder="Quantidade de perguntas" aria-label="Quantidade de perguntas" min="3">
                <input class="quantidade-niveis" type="number" placeholder="Quantidade de níveis" aria-label="Quantidade de níveis" min="2">
            </div>
            <button type="button" class="prosseguir" onclick="validarDadosBasicos()">Prosseguir para criar perguntas</button>
        </main>

        <main class="cria-perguntas"></main>
        <main class="cria-niveis"></main>
        <main class="sucesso-quizz"></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="src/script.js"></script>
</body>
</html>
