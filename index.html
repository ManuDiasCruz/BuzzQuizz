<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie, compartilhe e responda quizzes no BuzzQuizz.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styleMobile.css">
    <link rel="stylesheet" href="css/styleDesktop.css">
    <link rel="stylesheet" href="css/styleV2.css">
    <title>BuzzQuizz</title>
</head>

<body>
    <header>
        <button class="brand" type="button" onclick="paginaInicial()" aria-label="Voltar para o início">
            BuzzQuizz
        </button>
    </header>

    <main class="paginaum">
        <section class="criarprimeiroquizz">
            <p>Você ainda não criou nenhum quiz.</p>
            <button class="criarquizz" type="button" onclick="chamarTelaCriarQuizz()">Criar quiz</button>
        </section>

        <section class="meus-quizzes" aria-labelledby="meus-quizzes-titulo">
            <div class="novo-quizz">
                <h2 id="meus-quizzes-titulo">Seus quizzes</h2>
                <button class="adicionar-quizz" type="button" onclick="chamarTelaCriarQuizz()" aria-label="Criar outro quiz">+</button>
            </div>
            <div class="quizzes-criados"></div>
        </section>

        <section class="todososquizzes" aria-labelledby="todos-quizzes-titulo">
            <div class="section-heading">
                <div>
                    <span class="eyebrow">Descubra algo novo</span>
                    <h2 id="todos-quizzes-titulo">Todos os quizzes</h2>
                </div>
            </div>
            <p id="quiz-status" class="status-message" role="status" aria-live="polite">Carregando quizzes…</p>
            <div class="quizzes"></div>
        </section>
    </main>

    <main class="pagina-quizz" aria-live="polite"></main>
    <section class="fim" aria-live="polite"></section>

    <div class="cria-quizz">
        <main class="vamos-comecar">
            <h1>Comece pelo começo</h1>
            <div class="primeiro-forms">
                <input class="titulo-quizz" type="text" placeholder="Título do seu quiz" minlength="20" maxlength="65" aria-label="Título do quiz">
                <input class="url-quizz" type="url" placeholder="URL da imagem do seu quiz" aria-label="URL da imagem do quiz">
                <input class="numero-perguntas" type="number" placeholder="Quantidade de perguntas" min="3" aria-label="Quantidade de perguntas">
                <input class="quantidade-niveis" type="number" placeholder="Quantidade de níveis" min="2" aria-label="Quantidade de níveis">
            </div>
            <button class="prosseguir" type="button" onclick="validarDadosBasicos()">Prosseguir para criar perguntas</button>
            <button class="link-button" type="button" onclick="paginaInicial()">Cancelar</button>
        </main>

        <main class="cria-perguntas"></main>
        <main class="cria-niveis"></main>
        <main class="sucesso-quizz"></main>
    </div>

    <noscript>Ative o JavaScript para usar o BuzzQuizz.</noscript>
    <script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
    <script src="src/quiz-utils.js"></script>
    <script src="src/script.js"></script>
</body>

</html>
