<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="BuzzQuizz - crie e responda quizzes divertidos direto do navegador, sem instalar nada.">
    <meta name="theme-color" content="#EC362D">
    <title>BuzzQuizz</title>

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23EC362D'/%3E%3Cpath d='M18 4 8 18h6l-2 10 12-15h-7l2-9z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styleMobile.css" />
    <link rel="stylesheet" href="css/styleDesktop.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <header>
        <button type="button" class="voltar-home" onclick="voltarInicio()" title="Voltar para a página inicial">
            <h1>BuzzQuizz</h1>
        </button>
    </header>

    <!-- Avisos (substituem os alert() da primeira versão) -->
    <div id="avisos" aria-live="polite"></div>

    <!-- Indicador de carregamento -->
    <div id="carregando" class="escondido" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p>Carregando quizzes...</p>
    </div>

    <!--------------------- lista de quizzes (tela inicial) ---------------------->

    <main class="paginaum">
        <section class="criarprimeiroquizz">
            <p>Você não criou nenhum quizz ainda :(</p>
            <button type="button" class="criarquizz" onclick="chamarTelaCriarQuizz()">Criar Quizz</button>
        </section>

        <section class="meus-quizzes">
            <div class="novo-quizz">
                <h2>Seus Quizzes</h2>
                <button type="button" class="botao-novo-quizz" onclick="chamarTelaCriarQuizz()"
                    title="Criar um novo quizz" aria-label="Criar um novo quizz">
                    <ion-icon name="add-outline"></ion-icon>
                </button>
            </div>
            <div class="quizzes-criados"></div>
        </section>

        <section class="todososquizzes">
            <h2>Todos os Quizzes</h2>
            <p id="nota-demo" class="nota-demo escondido">
                Servidor indisponível: exibindo os quizzes de demonstração que acompanham o projeto.
            </p>
            <label class="campo-busca">
                <span class="sr-only">Buscar quizz pelo título</span>
                <input id="busca-quizz" type="search" placeholder="Buscar quizz pelo título..."
                    autocomplete="off" />
            </label>
            <div class="quizzes"></div>
        </section>
    </main>

    <!--------------------- página de um quizz ---------------------->

    <!-- O conteúdo é montado por montarTelaQuizz() em src/script.js -->
    <main class="pagina-quizz"></main>
    <div class="fim"></div>

    <!--------------------- criação de quizz ---------------------->

    <div class="cria-quizz">
        <!-- Etapa 1: dados básicos -->
        <main class="vamos-comecar">
            <h1>Comece pelo começo</h1>
            <div class="primeiro-forms">
                <input class="titulo-quizz" type="text" placeholder="Título do seu quizz" minlength="20"
                    maxlength="65" />
                <input class="url-quizz" type="url" placeholder="URL da imagem do seu quizz" />
                <input class="numero-perguntas" type="number" placeholder="Quantidade de perguntas do quizz"
                    min="3" />
                <input class="quantidade-niveis" type="number" placeholder="Quantidade de níveis do quizz"
                    min="2" />
            </div>
            <button type="button" class="prosseguir" onclick="validarDadosBasicos()">
                <p>Prosseguir pra criar perguntas</p>
            </button>
        </main>

        <!-- Etapa 2: perguntas (montada por montarTelaCriarPerguntas()) -->
        <main class="cria-perguntas"></main>

        <!-- Etapa 3: níveis (montada por montarTelaCriarNiveis()) -->
        <main class="cria-niveis"></main>

        <!-- Etapa 4: sucesso (montada por mostrarTelaSucessoCriacaoQuizz()) -->
        <main class="sucesso-quizz"></main>
    </div>

    <!-- Arquivos de JavaScript usados no código -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="src/quizzesDemo.js"></script>
    <script src="src/script.js"></script>
</body>

</html>
