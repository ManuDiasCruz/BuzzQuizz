<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styleMobile.css" />
    <link rel="stylesheet" href="css/styleDesktop.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>BuzzQuizz</title>
</head>

<body>
    <header>
        <h1>BuzzQuizz</h1>
    </header>

    <main class="paginaum">
        <section class="criarprimeiroquizz">
            <p>Você ainda nao criou nenhum quizz.</p>
            <button class="criarquizz" onclick="chamarTelaCriarQuizz()">Criar Quizz</button>
        </section>

        <section class="meus-quizzes">
            <div class="novo-quizz">
                <h2>Seus Quizzes</h2>
                <ion-icon name="add-outline" onclick="chamarTelaCriarQuizz()"></ion-icon>
            </div>
            <div class="quizzes-criados"></div>
        </section>

        <section class="todososquizzes">
            <h2>Todos os Quizzes</h2>
            <p class="feed-status" aria-live="polite"></p>
            <div class="quizzes"></div>
        </section>
    </main>

    <main class="pagina-quizz"></main>
    <div class="fim"></div>

    <div class="cria-quizz">
        <main class="vamos-comecar">
            <h1>Comece pelo começo</h1>
            <div class="primeiro-forms">
                <input class="titulo-quizz" type="text" placeholder="Título do seu quizz" minlength="20" maxlength="65" />
                <input class="url-quizz" type="url" placeholder="URL da imagem do seu quizz" />
                <input class="numero-perguntas" type="number" placeholder="Quantidade de perguntas do quizz" min="3" />
                <input class="quantidade-niveis" type="number" placeholder="Quantidade de niveis do quizz" min="2" />
            </div>
            <button class="prosseguir" onclick="validarDadosBasicos()">
                <p>Prosseguir pra criar perguntas</p>
            </button>
        </main>

        <main class="cria-perguntas"></main>

        <main class="cria-niveis">
            <h1>Agora, decida os niveis!</h1>
            <div class="nivel" data-identifier="level">
                <h2>Nivel 1</h2>
                <input class="titulo-nivel" type="text" placeholder="Titulo do nivel" minlength="10" />
                <input class="percentual-nivel" type="number" placeholder="% de acerto minima" min="0" max="100" />
                <input class="url-nivel" type="url" placeholder="URL da imagem do nivel" />
                <textarea class="descricao-nivel" type="text" placeholder="Descricao do nivel" minlength="30"></textarea>
            </div>
            <div class="novo-nivel" data-identifier="expand">
                <h2>Nivel 2</h2>
                <img class="botaoEditar" src="img/editar.png" alt="Botao editar" onclick="abrirNovoNivel(this)">
            </div>
            <button class="finaliza-quizz" onclick="validarTodosNiveis()">
                <p>Finalizar Quizz</p>
            </button>
        </main>

        <main class="sucesso-quizz"></main>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="src/script.js"></script>
</body>

</html>
