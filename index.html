<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BuzzQuizz v2 - crie e responda quizzes divertidos." />
    <link rel="icon" type="image/svg+xml" href="img/logo.svg" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styleMobile.css" />
    <link rel="stylesheet" href="css/styleDesktop.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <title>BuzzQuizz</title>
</head>

<body>
    <header>
        <h1 onclick="paginaInicial()" title="Voltar para o início">BuzzQuizz</h1>
    </header>

    <!-- lista-quizz: tela inicial -->
    <main class="paginaum">
        <section class="criarprimeiroquizz">
            <p>Você não criou nenhum quizz ainda :(</p>
            <button class="criarquizz" onclick="chamarTelaCriarQuizz()">Criar Quizz</button>
        </section>
        <section class="meus-quizzes">
            <div class="novo-quizz">
                <h2>Seus Quizzes</h2>
                <ion-icon name="add-outline" onclick="chamarTelaCriarQuizz()"></ion-icon>
            </div>
            <div class="quizzes-criados"></div>
        </section>
        <section class="todososquizzes">
            <h2>Todos os Quizzes</h2>
            <div class="quizzes"></div>
        </section>
    </main>

    <!-- pagina-quizz: responder um quizz -->
    <main class="pagina-quizz"></main>
    <div class="fim"></div>

    <!-- cria-quizz: fluxo de criação -->
    <div class="cria-quizz">
        <main class="vamos-comecar">
            <h1>Comece pelo começo</h1>
            <div class="primeiro-forms">
                <input class="titulo-quizz" type="text" placeholder="Título do seu quizz" minlength="20" maxlength="65" />
                <input class="url-quizz" type="url" placeholder="URL da imagem do seu quizz" />
                <input class="numero-perguntas" type="number" placeholder="Quantidade de perguntas do quizz" min="3" />
                <input class="quantidade-niveis" type="number" placeholder="Quantidade de níveis do quizz" min="2" />
            </div>
            <button class="prosseguir" onclick="validarDadosBasicos()">
                <p>Prosseguir pra criar perguntas</p>
            </button>
        </main>

        <main class="cria-perguntas"></main>

        <main class="cria-niveis"></main>

        <main class="sucesso-quizz"></main>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="src/script.js"></script>
</body>

</html>
